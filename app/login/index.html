<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WalaiTrack — เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Prompt:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="scene">
  <div class="grain"></div>
  <div class="warm-vignette"></div>
  <div class="ridge" aria-hidden="true">
    <svg viewBox="0 0 1600 500" preserveAspectRatio="none">
      <path d="M0,320 L120,270 L260,330 L400,240 L560,300 L700,220 L860,290 L1020,230 L1180,300 L1340,250 L1600,310 L1600,500 L0,500 Z" fill="#c9b99a" opacity="0.55"/>
      <path d="M0,380 L180,340 L340,390 L520,330 L680,370 L860,320 L1040,380 L1220,330 L1400,385 L1600,350 L1600,500 L0,500 Z" fill="#b5a17c" opacity="0.55"/>
    </svg>
  </div>

  <div class="shell">
    <!-- Left brand panel -->
    <div class="brand-side">
      <div class="logomark">
        <img src="assets/logo.svg" alt="WalaiTrack logo" width="56" height="56">
        <div class="logo-text"><span class="help">Walai</span><span class="track">Track</span></div>
      </div>
      <p class="tagline">ระบบติดตามการบริจาคและกระจายสิ่งของ<br>ช่วยเหลือภัยพิบัติ</p>
      <div class="divider"></div>
      <div class="feature-row">
        <div class="feature heart">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.3-9.3-8.3C.8 9.7 1.6 6 4.7 4.7 7 3.7 9.3 4.6 12 7.4c2.7-2.8 5-3.7 7.3-2.7 3.1 1.3 3.9 5 2 8.9C18.7 16.7 12 21 12 21z"/></svg>
          <span>บริจาค</span>
        </div>
        <div class="feature box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
          <span>ติดตาม</span>
        </div>
        <div class="feature people">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>ช่วยเหลือ</span>
        </div>
      </div>
    </div>

    <!-- Right login card -->
    <div class="card-wrap">
      <div class="card">
        <div class="card-logo">
          <img src="assets/logo.svg" alt="HelpTrack logo" width="58" height="58">
        </div>
        <h1>ยินดีต้อนรับ</h1>
        <p class="sub">เข้าสู่ระบบเพื่อใช้งานระบบ<br>ติดตามการบริจาคและกระจายสิ่งของช่วยเหลือภัยพิบัติ</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            <input type="text" id="username" name="username" placeholder="ชื่อผู้ใช้ หรือ อีเมล" autocomplete="username" required>
          </div>

          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="password" name="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="แสดงรหัสผ่าน">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>

          <div class="row-between">
            <label class="remember">
              <input type="checkbox" id="remember">
              จดจำฉันไว้
            </label>
            <a href="#" class="link">ลืมรหัสผ่าน?</a>
          </div>

          <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
        </form>

        <div class="or-divider">หรือ</div>

        <button type="button" class="btn btn-outline" id="volunteerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          เข้าสู่ระบบในฐานะอาสาสมัคร
        </button>

        <p class="signup">ยังไม่มีบัญชี? <a href="#" class="link">สมัครสมาชิก</a></p>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
